<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow AI | De Papel a Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto py-12 px-4">
      <nav class="absolute top-0 right-0 p-6">
        <div class="flex items-center gap-4">
          <span class="text-slate-600 font-medium"
            >Hola, {{ user.username }}</span
          >
          <a
            href="/logout"
            class="bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-100 transition text-sm font-bold"
          >
            Cerrar Sesión
          </a>
        </div>
      </nav>
      <header class="text-center mb-12">
        <h1 class="text-4xl font-bold text-indigo-600 mb-2">StudyFlow AI 🚀</h1>
        <p class="text-slate-600">
          Sube tus apuntes y deja que la IA haga el trabajo sucio.
        </p>
      </header>

      <div
        class="bg-white p-8 rounded-2xl shadow-sm border-2 border-dashed border-indigo-200 text-center mb-8"
      >
        <input type="file" id="fileInput" class="hidden" accept="image/*" />
        <label for="fileInput" class="cursor-pointer">
          <div class="text-indigo-500 mb-4">
            <svg
              class="w-12 h-12 mx-auto"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
          </div>
          <span class="text-lg font-medium text-slate-700"
            >Haz clic para subir o arrastra una imagen</span
          >
          <p class="text-sm text-slate-400 mt-1">
            Soporta JPG, PNG (Apuntes o Libros)
          </p>
        </label>
        <button
          onclick="uploadFile()"
          id="uploadBtn"
          class="mt-6 bg-indigo-600 text-white px-8 py-2 rounded-full font-semibold hover:bg-indigo-700 transition hidden"
        >
          Procesar Apuntes
        </button>
      </div>

      <div id="loader" class="hidden text-center py-8">
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"
        ></div>
        <p class="mt-4 text-indigo-600 font-medium">
          Leyendo tus apuntes con GLM-OCR...
        </p>
      </div>

      <div id="results" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
          <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">
            📖 Texto Extraído
          </h3>
          <p id="ocrText" class="text-slate-600 whitespace-pre-wrap"></p>
        </div>

        <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100">
          <h3
            class="text-lg font-bold text-indigo-800 mb-4 border-b border-indigo-200 pb-2"
          >
            ✨ Resumen y Flashcards
          </h3>
          <div id="aiAnalysis" class="prose max-w-none text-indigo-900"></div>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const uploadBtn = document.getElementById("uploadBtn");

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) uploadBtn.classList.remove("hidden");
      });

      async function uploadFile() {
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", file);

        // UI State
        document.getElementById("loader").classList.remove("hidden");
        document.getElementById("results").classList.add("hidden");
        uploadBtn.disabled = true;

        try {
          const response = await fetch("/process", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();

          if (data.success) {
            document.getElementById("ocrText").innerText = data.extracted_text;
            document.getElementById("aiAnalysis").innerText = data.analysis;
            document.getElementById("results").classList.remove("hidden");
          } else {
            alert("Error: " + data.error);
          }
        } catch (err) {
          alert("Error de conexión con el servidor.");
        } finally {
          document.getElementById("loader").classList.add("hidden");
          uploadBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
