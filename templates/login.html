<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - IA Study Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-3xl font-bold text-slate-800 mb-6 text-center">Bienvenido de nuevo</h2>
        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600">Usuario</label>
                <input type="text" name="username" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600">Contraseña</label>
                <input type="password" name="password" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
                Entrar
            </button>
        </form>
        <p class="mt-6 text-center text-slate-500">
            ¿No tienes cuenta? <a href="/register" class="text-indigo-600 font-medium">Regístrate aquí</a>
        </p>
    </div>
</body>
</html>
